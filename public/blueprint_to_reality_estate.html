    /* Glassmorphism panel styling with royal orange accents */

    .glass-card {

    /* Smooth custom scrollbar */

    /* Animated pulse dot */
    @keyframes ping-slow {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }
    .animate-ping-slow {
      animation: ping-slow 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
  </style>

</head>

      <!-- Minimal sleek left-pointing arrow -->

  <!-- 
    ========================================================================
    THREE.JS PROCEDURAL 3D APPLICATION & SCROLL INTERPOLATION LOGIC
    ========================================================================
  -->
  <script type="module">
    import * as THREE from 'three';

    /* ==========================================================================
       ROYAL PROCEDURAL TEXTURE GENERATION ENGINES
       ========================================================================== */

    // 1. Calacatta Gold Italian Marble (Luminous white base with warm gold & soft grey veins)
    function createCalacattaMarbleTexture() {
      const size = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Base warm ivory stone
      const bgGrad = ctx.createLinearGradient(0, 0, size, size);
      bgGrad.addColorStop(0, '#f9f8f4');
      bgGrad.addColorStop(0.5, '#f3f1ea');
      bgGrad.addColorStop(1, '#fdfcf9');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, size, size);

      // Micro mineral specks
      const imgData = ctx.getImageData(0, 0, size, size);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 8;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise - 1));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise - 3));
      }
      ctx.putImageData(imgData, 0, 0);

      // Procedural Marble Vein Drawer
      function drawVein(points, strokeColor, width, blur) {
        ctx.save();
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.shadowColor = strokeColor;
        ctx.shadowBlur = blur;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const xc = (points[i].x + points[i + 1].x) / 2;
          const yc = (points[i].y + points[i + 1].y) / 2;
          ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
        }
        ctx.stroke();
        ctx.restore();
      }

      // Soft Smokey Grey Under-Veins
      for (let v = 0; v < 3; v++) {
        const pts = [];
        let y = (v * 300) + 100;
        for (let x = 0; x <= size; x += 120) {
          pts.push({ x, y: y + (Math.sin(x * 0.015) * 110) + (Math.random() - 0.5) * 45 });
        }
        drawVein(pts, 'rgba(175, 172, 168, 0.22)', 14, 18);
      }

      // Vivid Golden Amber Master Veins
      for (let v = 0; v < 4; v++) {
        const pts = [];
        let y = (v * 260) + 60;
        for (let x = 0; x <= size; x += 90) {
          pts.push({ x, y: y + (Math.cos(x * 0.012 + v) * 90) + (Math.random() - 0.5) * 60 });
        }
        drawVein(pts, 'rgba(212, 160, 68, 0.45)', 4.5, 8);
        drawVein(pts, 'rgba(158, 114, 40, 0.35)', 2.0, 2);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    // 2. Nero Marquina / Black & Gold Marble for Foundation Podium
    function createNeroGoldMarbleTexture() {
      const size = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#101317';
      ctx.fillRect(0, 0, size, size);

      // Deep rich texture variation
      const imgData = ctx.getImageData(0, 0, size, size);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 12;
        data[i] = Math.min(255, Math.max(0, data[i] + noise + 2));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise + 1));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);

      // Glowing Gold Fractal Fractures
      for (let v = 0; v < 5; v++) {
        ctx.strokeStyle = 'rgba(235, 185, 90, 0.35)';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        let curX = Math.random() * size;
        let curY = 0;
        ctx.moveTo(curX, curY);
        while (curY < size) {
          curX += (Math.random() - 0.5) * 60;
          curY += Math.random() * 40 + 20;
          ctx.lineTo(curX, curY);
        }
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    // 3. Hand-scraped Smoked Walnut with Satin Polish
    function createSmokedWalnutTexture() {
      const w = 512, h = 512;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#22160d';
      ctx.fillRect(0, 0, w, h);

      const plankHeight = 36;
      for (let y = 0; y < h; y += plankHeight) {
        ctx.fillStyle = (y / plankHeight) % 2 === 0 ? '#2c1c11' : '#1e130b';
        ctx.fillRect(0, y, w, plankHeight - 2);

        // Rich subtle golden woodgrain lines
        ctx.strokeStyle = 'rgba(195, 140, 75, 0.15)';
        ctx.lineWidth = 1;
        for (let j = 0; j < 6; j++) {
          const gy = y + Math.random() * plankHeight;
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.bezierCurveTo(w * 0.3, gy + (Math.random() - 0.5) * 5, w * 0.7, gy + (Math.random() - 0.5) * 5, w, gy);
          ctx.stroke();
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    // 4. Sparkling Water Normal Map for Turquoise Pool
    function createWaterNormalTexture() {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const imgData = ctx.createImageData(size, size);
      const data = imgData.data;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const idx = (y * size + x) * 4;
          const nx = Math.sin(x * 0.08) * Math.cos(y * 0.08) * 0.5;
          const ny = Math.cos(x * 0.08) * Math.sin(y * 0.08) * 0.5;
          data[idx] = Math.floor((nx + 1) * 127.5);
          data[idx + 1] = Math.floor((ny + 1) * 127.5);
          data[idx + 2] = 255;
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    // 5. Backlit Translucent Honey Onyx (Glowing golden-amber crystallite stone matrix)
    function createHoneyOnyxTexture() {
      const size = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createRadialGradient(size * 0.5, size * 0.5, 40, size * 0.5, size * 0.5, size * 0.7);
      bgGrad.addColorStop(0, '#ffe8b5');
      bgGrad.addColorStop(0.4, '#e6aa45');
      bgGrad.addColorStop(0.8, '#b87720');
      bgGrad.addColorStop(1, '#8f4f0e');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, size, size);

      // Micro-crystalline cellular patterns
      for (let c = 0; c < 28; c++) {
        const cx = Math.random() * size;
        const cy = Math.random() * size;
        const cr = Math.random() * 90 + 30;
        const cGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, cr);
        cGrad.addColorStop(0, 'rgba(255, 235, 175, 0.45)');
        cGrad.addColorStop(0.6, 'rgba(215, 145, 45, 0.25)');
        cGrad.addColorStop(1, 'rgba(140, 75, 15, 0)');
        ctx.fillStyle = cGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, cr, 0, Math.PI * 2);
        ctx.fill();
      }

      // Deep glowing dendritic veins
      for (let v = 0; v < 6; v++) {
        ctx.strokeStyle = 'rgba(255, 245, 210, 0.6)';
        ctx.lineWidth = Math.random() * 3 + 1.5;
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        let curX = Math.random() * size;
        let curY = 0;
        ctx.moveTo(curX, curY);
        while (curY < size) {
          curX += (Math.random() - 0.5) * 45;
          curY += Math.random() * 50 + 20;
          ctx.lineTo(curX, curY);
        }
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    // 6. Waterfall Water Blade Flow Texture
    function createWaterfallTexture() {
      const w = 256, h = 512;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'rgba(25, 110, 160, 0.35)';
      ctx.fillRect(0, 0, w, h);

      for (let x = 0; x < w; x += 3) {
        ctx.strokeStyle = `rgba(210, 245, 255, ${Math.random() * 0.45 + 0.2})`;
        ctx.lineWidth = Math.random() * 2 + 1;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + (Math.random() - 0.5) * 4, h);
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    /* ==========================================================================
       SCENE SETUP & OPULENT LIGHTING
       ========================================================================== */

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712); // Deep Royal Sapphire Night
    scene.fog = new THREE.FogExp2(0x050e1e, 0.009);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 800);
    camera.position.set(24, 38, 42);
    camera.lookAt(2, 6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.30;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Atmospheric royal ambient & twilight sun
    const hemiLight = new THREE.HemisphereLight(0x3e6b9e, 0x1a160d, 1.5);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffecd1, 1.8);
    sunLight.position.set(-28, 42, 28);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.bias = -0.0001;
    scene.add(sunLight);

    // Warm Interior Level 1 Grand Chandelier
    const grandLoungeLight = new THREE.PointLight(0xffbe6b, 0.0, 26, 1.3);
    grandLoungeLight.position.set(4.0, 3.2, 0.5);
    grandLoungeLight.castShadow = true;
    scene.add(grandLoungeLight);

    // Level 2 VIP Suite Interior Glow
    const level2SuiteLight = new THREE.PointLight(0xffaa4f, 0.0, 22, 1.2);
    level2SuiteLight.position.set(4.0, 7.8, 0.5);
    level2SuiteLight.castShadow = true;
    scene.add(level2SuiteLight);

    // Level 3 Master Penthouse Celestial Glow
    const penthouseLight = new THREE.PointLight(0xffd085, 0.0, 24, 1.4);
    penthouseLight.position.set(3.5, 12.5, 0.8);
    penthouseLight.castShadow = true;
    scene.add(penthouseLight);

    // Pool Terrace Submerged Turquoise Glow
    const poolAquaLight = new THREE.PointLight(0x00f0ff, 0.0, 24, 2.0);
    poolAquaLight.position.set(0.5, 0.1, 9.5);
    scene.add(poolAquaLight);

    // Sunken Fire Pit Amber Glow
    const firePitLight = new THREE.PointLight(0xff6e1a, 0.0, 12, 1.6);
    firePitLight.position.set(7.5, 0.7, 8.5);
    scene.add(firePitLight);

    // Multi-tier Cantilever Under-Soffit Golden Wash
    const terraceWash = new THREE.SpotLight(0xffcf7b, 0.0, 30, Math.PI / 3, 0.4, 1.0);
    terraceWash.position.set(2.0, 4.8, 5.0);
    terraceWash.target.position.set(2, 0, 8);
    scene.add(terraceWash);
    scene.add(terraceWash.target);

    // Backlit Honey Onyx Core Internal Light Column
    const onyxCoreLight = new THREE.PointLight(0xffaa2b, 0.0, 22, 1.5);
    onyxCoreLight.position.set(-3.2, 7.5, -0.5);
    scene.add(onyxCoreLight);

    // Waterfall Edge Cyan LED Grazer
    const waterfallLight = new THREE.SpotLight(0x60efff, 0.0, 15, Math.PI / 4, 0.5, 1.2);
    waterfallLight.position.set(10.5, 5.1, 7.5);
    waterfallLight.target.position.set(10.5, 0.2, 7.5);
    scene.add(waterfallLight);
    scene.add(waterfallLight.target);

    // Automotive Gallery Showcase Spotlights
    const autoGalleryLight = new THREE.SpotLight(0xffffff, 0.0, 18, Math.PI / 3.5, 0.2, 1.2);
    autoGalleryLight.position.set(-11.5, 3.8, 2.5);
    autoGalleryLight.target.position.set(-11.5, 0.5, 2.5);
    scene.add(autoGalleryLight);
    scene.add(autoGalleryLight.target);

    /* ==========================================================================
       ROYAL PBR MATERIALS: CALACATTA GOLD, CHAMPAGNE BRASS & HONEY GLASS
       ========================================================================== */

    const calacattaMap = createCalacattaMarbleTexture();
    calacattaMap.repeat.set(2, 2);
    const neroGoldMap = createNeroGoldMarbleTexture();
    neroGoldMap.repeat.set(2, 2);
    const walnutMap = createSmokedWalnutTexture();
    walnutMap.repeat.set(2, 2);
    const waterNormal = createWaterNormalTexture();
    waterNormal.repeat.set(6, 6);
    const honeyOnyxMap = createHoneyOnyxTexture();
    honeyOnyxMap.repeat.set(1, 2);
    const waterfallMap = createWaterfallTexture();
    waterfallMap.repeat.set(1, 3);

    // Luxurious Calacatta Gold Marble for Main Villa Volumes
    const calacattaMarbleMat = new THREE.MeshStandardMaterial({
      map: calacattaMap,
      roughness: 0.18,
      metalness: 0.05,
      color: 0xffffff,
      transparent: true,
      opacity: 0.0
    });

    // Nero Marquina Black & Gold Veined Marble
    const neroMarbleMat = new THREE.MeshStandardMaterial({
      map: neroGoldMap,
      roughness: 0.22,
      metalness: 0.12,
      color: 0x181a1f,
      transparent: true,
      opacity: 0.0

      finMesh.rotation.y = rotAngle;
      finMesh.position.set(4.0 + fx, 7.2, 5.0);
      parametricFinsGroup.add(finMesh);
    }
    groupFloor2.add(parametricFinsGroup);

    // Level 2 Cantilever Sky-Garden Balcony Planter
    const f2SkyGarden = createArchitecturalPlanter(8.0, 0.8, 3);
    f2SkyGarden.position.set(2.5, 5.4, 7.6);
    groupFloor2.add(f2SkyGarden);

    // Level 2 Cantilever Balcony Guard Rail in Crystal Glass & Brass Rail
    const f2RailGlass = new THREE.Mesh(new THREE.BoxGeometry(12.4, 1.15, 0.04), royalGlassMat);
    f2RailGlass.position.set(4.0, 5.8, 8.2);
    groupFloor2.add(f2RailGlass);

    const f2RailHand = new THREE.Mesh(new THREE.BoxGeometry(12.5, 0.06, 0.08), champagneBrassMat);
    f2RailHand.position.set(4.0, 6.4, 8.2);
    groupFloor2.add(f2RailHand);

    // 5. Stage E: Floor 3 (Second Floor / Level 3 Penthouse Sky Crown)
    const groupFloor3 = new THREE.Group();
    buildingRoot.add(groupFloor3);

    // Floor 3 Intermediate Marble Slab with Gold Fascia
    const f3SlabGeo = new THREE.BoxGeometry(15.5, 0.6, 13.5);
    const f3SlabMesh = new THREE.Mesh(f3SlabGeo, calacattaMarbleMat);
    f3SlabMesh.position.set(4.0, 9.5, -0.2);
    groupFloor3.add(f3SlabMesh);
    addEdges(f3SlabGeo, wireframesGroup, f3SlabMesh.matrixWorld);

    const f3GoldFascia = new THREE.Mesh(new THREE.BoxGeometry(15.6, 0.08, 13.6), champagneBrassMat);
    f3GoldFascia.position.set(4.0, 9.5, -0.2);
    groupFloor3.add(f3GoldFascia);

    // Under-Soffit LED Cove Strip for Level 2 Ceiling
    const f2CoveGeo = new THREE.BoxGeometry(14.5, 0.04, 6.5);
    const f2CoveMesh = new THREE.Mesh(f2CoveGeo, coveLightMat);
    f2CoveMesh.position.set(4.0, 9.18, 3.2);
    groupFloor3.add(f2CoveMesh);

    // Level 3 Penthouse Master Pavilion
    const pWallLGeo = new THREE.BoxGeometry(0.7, 3.8, 10.5);
    const pWallL = new THREE.Mesh(pWallLGeo, calacattaMarbleMat);
    pWallL.position.set(-1.8, 11.7, -0.8);
    groupFloor3.add(pWallL);
    addEdges(pWallLGeo, wireframesGroup, pWallL.matrixWorld);

    const pWallRGeo = new THREE.BoxGeometry(0.7, 3.8, 10.5);
    const pWallR = new THREE.Mesh(pWallRGeo, calacattaMarbleMat);
    pWallR.position.set(9.8, 11.7, -0.8);
    groupFloor3.add(pWallR);
    addEdges(pWallRGeo, wireframesGroup, pWallR.matrixWorld);

    // Penthouse Floor-to-Ceiling Curved & Linear Acoustic Glazing
    const pGlaze = new THREE.Mesh(new THREE.BoxGeometry(10.9, 3.6, 0.02), royalGlassMat);
    pGlaze.position.set(4.0, 11.7, 3.2);
    groupFloor3.add(pGlaze);

    for (let m = -4.0; m <= 4.0; m += 2.0) {
      const pmull = new THREE.Mesh(new THREE.BoxGeometry(0.08, 3.6, 0.08), champagneBrassMat);
      pmull.position.set(4.0 + m, 11.7, 3.22);
      groupFloor3.add(pmull);
    }

    // Penthouse Rooftop Glass Plunge Pool / Jacuzzi on the Sky Deck
    const skySpaGeo = new THREE.BoxGeometry(3.2, 0.8, 2.6);
    const skySpaWater = new THREE.Mesh(skySpaGeo, poolWaterMat);
    skySpaWater.position.set(8.2, 10.1, 4.6);
    groupFloor3.add(skySpaWater);

    const skySpaGlass = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.85, 2.7), royalGlassMat);
    skySpaGlass.position.set(8.2, 10.1, 4.6);
    groupFloor3.add(skySpaGlass);

    // Level 3 Penthouse Sky-Garden Planter with Mediterranean Cypress
    const pSkyGarden = createArchitecturalPlanter(5.4, 0.7, 2);
    pSkyGarden.position.set(1.5, 9.9, 5.6);
    groupFloor3.add(pSkyGarden);

    // Penthouse Roof Canopy & Aerodynamic Tapered Visor
    const pRoofGeo = new THREE.BoxGeometry(16.5, 0.55, 14.5);
    const pRoofMesh = new THREE.Mesh(pRoofGeo, calacattaMarbleMat);
    pRoofMesh.position.set(4.0, 13.8, 0.2);
    groupFloor3.add(pRoofMesh);
    addEdges(pRoofGeo, wireframesGroup, pRoofMesh.matrixWorld);

    const pRoofGoldTrim = new THREE.Mesh(new THREE.BoxGeometry(16.6, 0.08, 14.6), champagneBrassMat);
    pRoofGoldTrim.position.set(4.0, 13.8, 0.2);
    groupFloor3.add(pRoofGoldTrim);

    // Level 3 Golden Pergola Trellis (Louvers for Luxury Sky Observation Deck)
    const pergolaGroup = new THREE.Group();
    pergolaGroup.position.set(4.0, 14.4, 1.2);

    for (let b = -6.5; b <= 6.5; b += 1.1) {
      const beam = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.25, 9.5), champagneBrassMat);
      beam.position.set(b, 0, 0);
      pergolaGroup.add(beam);
    }
    groupFloor3.add(pergolaGroup);

    // Level 3 Sky Terrace Crystal Balustrade
    const pRailGlass = new THREE.Mesh(new THREE.BoxGeometry(11.2, 1.1, 0.04), royalGlassMat);
    pRailGlass.position.set(4.0, 10.3, 5.8);
    groupFloor3.add(pRailGlass);

    const pRailHand = new THREE.Mesh(new THREE.BoxGeometry(11.3, 0.06, 0.08), champagneBrassMat);
    pRailHand.position.set(4.0, 10.9, 5.8);
    groupFloor3.add(pRailHand);

    // Golden Architectural CAD Grid (Expanded for 3-Floor Master Scale)
    const cadGrid = new THREE.GridHelper(56, 56, 0xe2b45e, 0x162232);
    cadGrid.material.transparent = true;
    cadGrid.position.set(3, 0.02, 3);
    blueprintGroundGroup.add(cadGrid);

    // 2D Architectural Floor Plan Polyline Contours (Expanded layout)
    const planLineMat = new THREE.LineBasicMaterial({ color: 0xe2b45e, linewidth: 2, transparent: true });
    const planPoints = [
      // Site bounds
      new THREE.Vector3(-18, 0.05, -10), new THREE.Vector3(22, 0.05, -10),
      new THREE.Vector3(22, 0.05, -10), new THREE.Vector3(22, 0.05, 18),
      new THREE.Vector3(22, 0.05, 18), new THREE.Vector3(-18, 0.05, 18),
      new THREE.Vector3(-18, 0.05, 18), new THREE.Vector3(-18, 0.05, -10),
      // Ground salon bounds
      new THREE.Vector3(-4, 0.05, -7), new THREE.Vector3(12, 0.05, -7),
      new THREE.Vector3(12, 0.05, -7), new THREE.Vector3(12, 0.05, 5),
      new THREE.Vector3(12, 0.05, 5), new THREE.Vector3(-4, 0.05, 5),
      new THREE.Vector3(-4, 0.05, 5), new THREE.Vector3(-4, 0.05, -7),
      // Auto gallery bounds
      new THREE.Vector3(-16, 0.05, -2), new THREE.Vector3(-7, 0.05, -2),
      new THREE.Vector3(-7, 0.05, 7), new THREE.Vector3(-16, 0.05, 7),
      new THREE.Vector3(-16, 0.05, -2),
      // Pool bounds
      new THREE.Vector3(-7, 0.05, 5), new THREE.Vector3(11, 0.05, 5),
      new THREE.Vector3(11, 0.05, 5), new THREE.Vector3(11, 0.05, 16),
      new THREE.Vector3(11, 0.05, 16), new THREE.Vector3(-7, 0.05, 16),
      new THREE.Vector3(-7, 0.05, 16), new THREE.Vector3(-7, 0.05, 5)
    ];
    const planGeo = new THREE.BufferGeometry().setFromPoints(planPoints);
    const planMesh = new THREE.LineSegments(planGeo, planLineMat);
    blueprintGroundGroup.add(planMesh);

    // CAD Crosshairs & Dimension Marks
    function createCadCross(x, z, s = 0.8) {
      const pts = [
        new THREE.Vector3(x - s, 0.06, z), new THREE.Vector3(x + s, 0.06, z),
        new THREE.Vector3(x, 0.06, z - s), new THREE.Vector3(x, 0.06, z + s)
      ];
      return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), planLineMat);
    }
    blueprintGroundGroup.add(createCadCross(-4, -7));
    blueprintGroundGroup.add(createCadCross(12, -7));
    blueprintGroundGroup.add(createCadCross(12, 5));
    blueprintGroundGroup.add(createCadCross(-4, 5));
    blueprintGroundGroup.add(createCadCross(-16, -2));
    blueprintGroundGroup.add(createCadCross(-7, 7));

    /* ==========================================================================
       SCROLL ANIMATION ENGINE & CAMERA PATH FOR 3-FLOOR PALATIAL ESTATE
       ========================================================================== */

    const allPbrMaterials = [
      calacattaMarbleMat, neroMarbleMat, champagneBrassMat, mirrorGoldMat, 
      royalGlassMat, woodMat, royalVelvetMat, foliageDarkMat, foliageLightMat,
      carPaintMat
    ];

    const camPathPoints = [
      { t: 0.00, pos: new THREE.Vector3(24, 38, 42), target: new THREE.Vector3(2, 6, 0) },        // 01: Top blueprint master schematic
      { t: 0.20, pos: new THREE.Vector3(28, 18, 34), target: new THREE.Vector3(3.0, 3.5, 2.0) },  // 02: Massive podium, stepping stones & moat
      { t: 0.38, pos: new THREE.Vector3(22, 14, 26), target: new THREE.Vector3(4.0, 5.5, 2.0) },  // 03: Ground & Level 2 VIP wing with waterfall
      { t: 0.52, pos: new THREE.Vector3(18, 18, 28), target: new THREE.Vector3(4.0, 8.5, 1.5) },  // 04: Level 3 Penthouse, Sky-Gardens & Pergola
      { t: 0.68, pos: new THREE.Vector3(34, 20, 38), target: new THREE.Vector3(3.0, 6.8, 1.0) },  // 05: Panoramic long shot of huge 3-floor estate
      { t: 0.80, pos: new THREE.Vector3(18, 8.0, 22), target: new THREE.Vector3(4.2, 3.8, 2.5) }, // 06: Descending across reflection moat & waterfall
      { t: 0.88, pos: new THREE.Vector3(8.5, 3.2, 9.5), target: new THREE.Vector3(4.6, 2.5, 2.0) }, // 07: Stepping stones & terrace approach
      { t: 0.94, pos: new THREE.Vector3(5.6, 2.5, 3.6), target: new THREE.Vector3(4.6, 2.5, -2.0) }, // 08: Door threshold
      { t: 0.98, pos: new THREE.Vector3(4.6, 2.4, 0.8), target: new THREE.Vector3(4.5, 2.4, -4.5) }, // 09: Gliding through open champagne door
      { t: 1.00, pos: new THREE.Vector3(4.2, 2.2, -1.8), target: new THREE.Vector3(4.2, 2.2, -7.0) } // 10: Settled in Grand Royal Salon
    ];

    function getInterpolatedCam(progress) {
      const p = Math.max(0, Math.min(1, progress));
      for (let i = 0; i < camPathPoints.length - 1; i++) {
        const p1 = camPathPoints[i];
        const p2 = camPathPoints[i + 1];
        if (p >= p1.t && p <= p2.t) {
          const segT = (p - p1.t) / (p2.t - p1.t);
          const ease = 0.5 - 0.5 * Math.cos(segT * Math.PI);
          const pos = new THREE.Vector3().lerpVectors(p1.pos, p2.pos, ease);
          const target = new THREE.Vector3().lerpVectors(p1.target, p2.target, ease);
          return { pos, target };
        }
      }
      return camPathPoints[camPathPoints.length - 1];
    }

    // Interactive Room Cam targets for 3-Floor Villa
    let activeRoomCam = null;
    const roomCamPositions = {
      lounge: { pos: new THREE.Vector3(3.2, 2.4, 0.5), target: new THREE.Vector3(4.5, 2.2, -3.0) },
      waterfall: { pos: new THREE.Vector3(14.5, 4.2, 11.5), target: new THREE.Vector3(9.5, 3.5, 6.0) },
      autogallery: { pos: new THREE.Vector3(-14.0, 3.2, 7.5), target: new THREE.Vector3(-11.0, 1.2, 2.5) },
      penthouse: { pos: new THREE.Vector3(1.0, 14.5, 12.0), target: new THREE.Vector3(4.0, 12.5, 2.0) },
      aerial: { pos: new THREE.Vector3(34.0, 20.0, 38.0), target: new THREE.Vector3(3.0, 6.8, 1.0) }
    };

    let currentScrollProgress = 0;
    let targetScrollProgress = 0;

    const navStageIndicator = document.getElementById('nav-stage-indicator');
    const navStageText = document.getElementById('nav-stage-text');
    const navPctText = document.getElementById('nav-pct-text');
    const scrollPrompt = document.getElementById('scroll-prompt');

    const hudLeftStage = document.getElementById('hud-left-stage');
    const hudLeftDetail = document.getElementById('hud-left-detail');
    const hudRightTag = document.getElementById('hud-right-tag');
    const hudRightDetail = document.getElementById('hud-right-detail');

    function updateAssemblyProgress(t) {
      // 1. Stage A: Foundation & Moat (t: 0.02 -> 0.18)
      const tA = Math.max(0, Math.min(1, (t - 0.02) / 0.16));
      groupFoundation.position.y = -6 * (1 - tA);
      groupFoundation.scale.y = Math.max(0.001, tA);

      // 2. Stage B: Floor 1 Ground Salon (t: 0.14 -> 0.32)
      const tB = Math.max(0, Math.min(1, (t - 0.14) / 0.18));
      groupGroundFloor.position.y = -4 * (1 - tB);
      groupGroundFloor.scale.y = Math.max(0.001, tB);

      // 3. Stage C: Floor 2 VIP Cantilever Wing (t: 0.28 -> 0.46)
      const tC = Math.max(0, Math.min(1, (t - 0.28) / 0.18));
      groupFloor2.position.y = 10 * (1 - tC);
      groupFloor2.scale.set(1, Math.max(0.001, tC), 1);

      // 4. Stage D: Floor 3 Master Penthouse & Pergola (t: 0.40 -> 0.58)
      const tD = Math.max(0, Math.min(1, (t - 0.40) / 0.18));
      groupFloor3.position.y = 14 * (1 - tD);
      groupFloor3.scale.set(1, Math.max(0.001, tD), 1);

      // Materials fade in with glossy reflections
      const tMat = Math.max(0, Math.min(1, (t - 0.06) / 0.45));
      allPbrMaterials.forEach(m => {
        m.opacity = tMat;
      });
      poolWaterMat.opacity = Math.max(0, Math.min(0.92, (t - 0.12) / 0.30));
      coveLightMat.opacity = Math.max(0, Math.min(0.95, (t - 0.35) / 0.20));
      waterfallMat.opacity = Math.max(0, Math.min(0.88, (t - 0.32) / 0.20));
      backlitOnyxMat.opacity = Math.max(0, Math.min(0.98, (t - 0.15) / 0.30));
      backlitOnyxMat.emissiveIntensity = Math.max(0, Math.min(1.2, (t - 0.20) / 0.25));

      // Blueprint lines dissolve as real architecture solidifies
      const lineOpacity = Math.max(0.04, 1.0 - (t * 2.0));
      blueprintLineMat.opacity = lineOpacity;
      cadGrid.material.opacity = Math.max(0.03, 1.0 - (t * 2.2));

      // Opulent Warm Interior & Cove Lighting Activates
      const lightT = Math.max(0, Math.min(1, (t - 0.30) / 0.22));
      grandLoungeLight.intensity = 7.5 * lightT;
      level2SuiteLight.intensity = 6.2 * lightT;
      penthouseLight.intensity = 6.8 * lightT;
      poolAquaLight.intensity = 5.2 * lightT;
      firePitLight.intensity = 4.2 * lightT;
      terraceWash.intensity = 4.8 * lightT;
      onyxCoreLight.intensity = 6.5 * lightT;
      waterfallLight.intensity = 4.5 * lightT;
      autoGalleryLight.intensity = 5.5 * lightT;

      // 5. Motorized Sliding Door Opening (t: 0.86 -> 0.96)
      const doorOpenT = Math.max(0, Math.min(1, (t - 0.86) / 0.10));
      mainSlidingDoor.position.x = (8.6 * 0.24) + (doorOpenT * slidingDoorWidth * 0.90);

      // UI HUD updates
      const pct = Math.round(t * 100);
      if (navPctText) navPctText.textContent = `${pct}%`;

      if (t < 0.22) {
        if (navStageText) navStageText.textContent = "Phase 01: Substructure & Raft";
        if (navStageIndicator) navStageIndicator.className = "w-2.5 h-2.5 rounded-full bg-orange-500 shadow-[0_0_8px_#f97316]";
        if (hudLeftStage) hudLeftStage.textContent = "STAGE 01 // SUBSTRUCTURE";
        if (hudLeftDetail) hudLeftDetail.textContent = "Laser Rebar Alignment & Soil Bearing Audit";
        if (hudRightTag) hudRightTag.textContent = "PMC WATERPROOFING AUDIT";
        if (hudRightDetail) hudRightDetail.textContent = "Triple-Layer Tanking · 72-Hr Ponding";
      } else if (t < 0.48) {
        if (navStageText) navStageText.textContent = "Phase 02: RCC Framing & Cantilevers";
        if (navStageIndicator) navStageIndicator.className = "w-2.5 h-2.5 rounded-full bg-orange-500 shadow-[0_0_8px_#f97316]";
        if (hudLeftStage) hudLeftStage.textContent = "STAGE 02 // RCC FRAMING";
        if (hudLeftDetail) hudLeftDetail.textContent = "Laser Plumbness & M25 Cube Lab Strength";
        if (hudRightTag) hudRightTag.textContent = "BILL MEASUREMENT AUDIT";
        if (hudRightDetail) hudRightDetail.textContent = "Physical Bar-Bending Tally · Zero Escalation";
      } else if (t < 0.74) {
        if (navStageText) navStageText.textContent = "Phase 03: Clash-Free MEP & Facades";
        if (navStageIndicator) navStageIndicator.className = "w-2.5 h-2.5 rounded-full bg-orange-400 shadow-[0_0_8px_#fb923c]";
        if (hudLeftStage) hudLeftStage.textContent = "STAGE 03 // MEP & FACADE";
        if (hudLeftDetail) hudLeftDetail.textContent = "Slimline Acoustic DGU Glazing (42dB) & Conduits";
        if (hudRightTag) hudRightTag.textContent = "VAASTU & MEP INTEGRATION";
        if (hudRightDetail) hudRightDetail.textContent = "Pancha-Tattva Solar Zoning · 5-Bar Hydro Test";
      } else {
        if (navStageText) navStageText.textContent = "Phase 04: Luxury Finishing & Handover";
        if (navStageIndicator) navStageIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]";
        if (hudLeftStage) hudLeftStage.textContent = "STAGE 04 // LUXURY FINISH";
        if (hudLeftDetail) hudLeftDetail.textContent = "Statuario Dry-Lay, Shadow Gaps & Snag-Free";
        if (hudRightTag) hudRightTag.textContent = "PMC DELIVERY DOSSIER";
        if (hudRightDetail) hudRightDetail.textContent = "200-Point Quality Sign-Off · Keys Handover";
      }

      if (t > 0.04) {
        scrollPrompt.style.opacity = '0';
      } else {
        scrollPrompt.style.opacity = '1';
      }
    }

    // Calculate Scroll Progress based on window position within track
    const scrollTrack = document.getElementById('scroll-track');
    window.addEventListener('scroll', () => {
      const trackRect = scrollTrack.getBoundingClientRect();
      const trackHeight = scrollTrack.offsetHeight - window.innerHeight;
      const scrolled = -trackRect.top;
      targetScrollProgress = Math.max(0, Math.min(1, scrolled / trackHeight));

      if (targetScrollProgress < 0.98) {
        activeRoomCam = null;
      }
    });

    // Chapter Dots click navigation
    const chapterDots = document.querySelectorAll('.chapter-dot');
    chapterDots.forEach(btn => {
      btn.addEventListener('click', () => {
        const targetPct = parseFloat(btn.dataset.target);
        const trackHeight = scrollTrack.offsetHeight - window.innerHeight;
        const targetScrollY = targetPct * trackHeight;
        window.scrollTo({ top: targetScrollY, behavior: 'smooth' });
      });
    });

    // Skip to interior button in top bar
    const btnJumpInterior = document.getElementById('btn-jump-interior');
    if (btnJumpInterior) {
      btnJumpInterior.addEventListener('click', () => {
        const trackHeight = scrollTrack.offsetHeight - window.innerHeight;
        window.scrollTo({ top: trackHeight, behavior: 'smooth' });
      });
    }

    // Window Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    /* ==========================================================================
       MAIN ANIMATION LOOP (Butter-Smooth Lerp Damping & Luxury Micro-Dynamics)
       ========================================================================== */

    const clock = new THREE.Clock();
    const currentCamTarget = new THREE.Vector3(2, 0, 0);

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      // Smooth damped interpolation towards target scroll progress
      currentScrollProgress += (targetScrollProgress - currentScrollProgress) * 0.08;
      updateAssemblyProgress(currentScrollProgress);

      if (activeRoomCam) {
        camera.position.lerp(activeRoomCam.pos, 0.05);
        currentCamTarget.lerp(activeRoomCam.target, 0.05);
      } else {
        const camData = getInterpolatedCam(currentScrollProgress);
        camera.position.lerp(camData.pos, 0.08);
        currentCamTarget.lerp(camData.target, 0.08);
      }

      camera.lookAt(currentCamTarget);

      // Crystalline Turquoise Water Shimmer
      waterNormal.offset.x = (elapsedTime * 0.02) % 1;
      waterNormal.offset.y = (elapsedTime * 0.035) % 1;

      // Realistic Vertical Flow for Cascading Water Blade
      waterfallMap.offset.y = -(elapsedTime * 0.6) % 1;

      // Organic Breathing Luminous Pulse on Backlit Honey Onyx Core
      if (currentScrollProgress > 0.25) {
        const pulse = 1.0 + Math.sin(elapsedTime * 1.5) * 0.15;
        backlitOnyxMat.emissiveIntensity = 1.2 * pulse;
        onyxCoreLight.intensity = 6.5 * pulse;
      }

      // Realistic Micro-Flicker in Sunken Fire Lounge
      if (currentScrollProgress > 0.3) {
        firePitLight.intensity = 4.2 + Math.sin(elapsedTime * 8) * 0.4 + Math.cos(elapsedTime * 15) * 0.2;
      }

      // Subtle atmospheric breathing in golden twilight
      sunLight.position.x = -28 + Math.sin(elapsedTime * 0.10) * 2.2;

      renderer.render(scene, camera);
    }

    // Initialize initial state immediately
    updateAssemblyProgress(0);

    // Safe execution on window load
    window.onload = () => {
      animate();
    };
  </script>
